<script>
  (() => {
    const source = document.querySelector('#education');
    const timeline = source?.querySelector('.w-full > .relative');
    const sections = document.querySelectorAll(
      '#biography .resume-biography .md\\:col-span-8 > .mb-16'
    );
    const target = [...sections].find((section) =>
      section.querySelector(':scope > .grid')
    );
    const cards = target?.querySelector(':scope > .grid');

    if (!source || !timeline || !target || !cards) return;

    cards.replaceWith(timeline);
    source.remove();
  })();
</script>
