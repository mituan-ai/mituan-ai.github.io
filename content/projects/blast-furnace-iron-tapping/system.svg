<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Blast-furnace iron-tapping state recognition system</title>
  <desc id="desc">An anonymous diagram of sensing, temporal modeling, state recognition, and production software for iron tapping.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67e8f9"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <circle cx="1290" cy="130" r="240" fill="#2563eb" opacity=".12"/>
  <circle cx="165" cy="865" r="260" fill="#0f766e" opacity=".13"/>
  <text x="82" y="92" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Blast-furnace iron-tapping intelligence</text>
  <text x="82" y="136" font-family="Inter,Arial,sans-serif" font-size="20" fill="#94a3b8">Sensing · temporal recognition · state stabilization · industrial software</text>

  <g transform="translate(100 210)">
    <path d="M160 35h300l-54 420H214z" fill="url(#steel)" stroke="#94a3b8" stroke-width="4"/>
    <path d="M207 335h207l-9 72H216z" fill="url(#metal)" filter="url(#glow)"/>
    <path d="M405 372h120" stroke="#fb923c" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M525 372c95 0 105 110 170 110" fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="round"/>
    <path d="M75 238h92" stroke="#67e8f9" stroke-width="5" stroke-dasharray="12 10"/>
    <path d="M77 210l80 28-80 28z" fill="#22d3ee" opacity=".75"/>
    <rect x="10" y="180" width="72" height="116" rx="16" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="46" cy="218" r="18" fill="#cffafe"/>
    <text x="310" y="535" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Level tracking and tapping signals</text>
  </g>

  <path d="M795 494H925" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(950 215)" font-family="Inter,Arial,sans-serif">
    <rect width="560" height="530" rx="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="48" y="62" font-size="19" font-weight="700" fill="#67e8f9">TEMPORAL STATE PIPELINE</text>
    <g transform="translate(48 106)">
      <rect width="464" height="86" rx="17" fill="#172554" stroke="#60a5fa"/>
      <path d="M28 50c30-20 50 24 78-4s52 20 82-3 50 12 80-5 50 14 84-9" fill="none" stroke="#38bdf8" stroke-width="4"/>
      <text x="380" y="54" text-anchor="middle" font-size="21" fill="#e2e8f0">Signal window</text>
    </g>
    <path d="M280 206v38" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="48" y="260" width="216" height="100" rx="18" fill="#1e3a8a" stroke="#818cf8"/>
    <text x="156" y="304" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Bi-GRU model</text>
    <text x="156" y="334" text-anchor="middle" font-size="17" fill="#c7d2fe">Temporal representation</text>
    <rect x="296" y="260" width="216" height="100" rx="18" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="404" y="304" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Post-processing</text>
    <text x="404" y="334" text-anchor="middle" font-size="17" fill="#99f6e4">Stable state decisions</text>
    <path d="M264 310h22" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(48 407)" font-size="18" text-anchor="middle">
      <rect width="130" height="62" rx="31" fill="#0e7490"/><text x="65" y="39" fill="#fff">Start</text>
      <path d="M140 31h34" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="184" width="130" height="62" rx="31" fill="#c2410c"/><text x="249" y="39" fill="#fff">Tapping</text>
      <path d="M324 31h34" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="368" width="96" height="62" rx="31" fill="#475569"/><text x="416" y="39" fill="#fff">End</text>
    </g>
  </g>

  <g transform="translate(145 812)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect width="1310" height="110" rx="25" fill="#ffffff" fill-opacity=".06" stroke="#475569"/>
    <text x="655" y="38" font-size="17" font-weight="700" fill="#94a3b8">PRODUCTION INTEGRATION</text>
    <text x="175" y="78" font-size="22" fill="#e2e8f0">Field communication</text>
    <circle cx="360" cy="71" r="5" fill="#2dd4bf"/><text x="510" y="78" font-size="22" fill="#e2e8f0">Algorithm services</text>
    <circle cx="690" cy="71" r="5" fill="#2dd4bf"/><text x="850" y="78" font-size="22" fill="#e2e8f0">Digital-twin view</text>
    <circle cx="1008" cy="71" r="5" fill="#2dd4bf"/><text x="1160" y="78" font-size="22" fill="#e2e8f0">Web platform</text>
  </g>
</svg>
