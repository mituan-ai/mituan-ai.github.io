<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LF refining visual perception and control loop</title>
  <desc id="desc">An anonymous closed-loop diagram connecting furnace imaging, slag-state analysis, bottom-blowing control, and a PLC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="furnace" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#64748b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <radialGradient id="slag"><stop stop-color="#fef3c7"/><stop offset=".45" stop-color="#fb923c"/><stop offset="1" stop-color="#991b1b"/></radialGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0f766e"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="34" fill="url(#bg)"/>
  <text x="78" y="88" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">LF refining: perception linked to control</text>
  <text x="78" y="132" font-family="Inter,Arial,sans-serif" font-size="20" fill="#475569">Anonymous public architecture · plant-specific settings omitted</text>

  <g transform="translate(85 250)" filter="url(#shadow)">
    <path d="M110 80h360l-45 430c-4 46-53 84-135 84s-131-38-135-84z" fill="url(#furnace)" stroke="#334155" stroke-width="5"/>
    <ellipse cx="290" cy="88" rx="180" ry="68" fill="#1e293b" stroke="#64748b" stroke-width="5"/>
    <ellipse cx="290" cy="94" rx="145" ry="47" fill="url(#slag)"/>
    <path d="M235 66c30 25 72-28 116 2M205 100c42-28 98 31 170-5" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    <path d="M205 566l32-88M290 586V478M375 566l-32-88" stroke="#22d3ee" stroke-width="13" stroke-linecap="round"/>
    <circle cx="205" cy="478" r="10" fill="#cffafe"/><circle cx="290" cy="478" r="10" fill="#cffafe"/><circle cx="375" cy="478" r="10" fill="#cffafe"/>
    <text x="290" y="655" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">LF furnace</text>
  </g>

  <g transform="translate(635 198)" font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect width="360" height="174" rx="24" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="34" y="47" width="84" height="66" rx="12" fill="#1e3a8a"/>
    <circle cx="76" cy="80" r="20" fill="#bae6fd" stroke="#38bdf8" stroke-width="5"/>
    <path d="M118 64l50-23v78l-50-23z" fill="#334155"/>
    <text x="270" y="75" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Process imaging</text>
    <text x="270" y="107" text-anchor="middle" font-size="16" fill="#475569">Visual state acquisition</text>
    <rect y="238" width="360" height="174" rx="24" fill="#fff" stroke="#5eead4" stroke-width="2"/>
    <path d="M38 326c18-40 36 40 55 0s36 40 55 0" fill="none" stroke="#0f766e" stroke-width="6"/>
    <text x="260" y="315" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Slag-state analysis</text>
    <text x="260" y="348" text-anchor="middle" font-size="16" fill="#475569">Visual perception model</text>
    <rect y="476" width="360" height="174" rx="24" fill="#fff" stroke="#818cf8" stroke-width="2"/>
    <g transform="translate(34 522)" fill="none" stroke="#4f46e5" stroke-width="5"><circle cx="40" cy="40" r="30"/><path d="M40 10v60M10 40h60"/></g>
    <text x="255" y="553" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Bottom-blowing control</text>
    <text x="255" y="586" text-anchor="middle" font-size="16" fill="#475569">Mode and control logic</text>
  </g>

  <g transform="translate(1135 350)" font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect width="340" height="310" rx="28" fill="#0f172a"/>
    <text x="170" y="70" text-anchor="middle" font-size="19" font-weight="700" fill="#67e8f9">PLC INTEGRATION</text>
    <g transform="translate(72 104)">
      <rect width="196" height="110" rx="15" fill="#334155" stroke="#94a3b8" stroke-width="3"/>
      <rect x="22" y="25" width="62" height="60" rx="7" fill="#0f766e"/>
      <g fill="#2dd4bf"><circle cx="112" cy="38" r="8"/><circle cx="141" cy="38" r="8"/><circle cx="170" cy="38" r="8"/></g>
      <path d="M108 70h66M108 87h66" stroke="#94a3b8" stroke-width="4"/>
    </g>
    <text x="170" y="260" text-anchor="middle" font-size="22" fill="#e2e8f0">Production control interface</text>
  </g>

  <path d="M538 397H615" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M815 372V420" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M815 610V658" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M995 761C1080 761 1095 615 1120 530" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1305 660C1305 865 490 900 365 785" fill="none" stroke="#0f766e" stroke-width="5" stroke-dasharray="14 11" marker-end="url(#arrow)"/>
  <text x="800" y="950" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#0f766e">Closed loop: image → state → control → process response</text>
</svg>
